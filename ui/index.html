<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工兵台 · Marvis Local Desk</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">工兵台</span>
      <span class="brand-sub">MARVIS&nbsp;LOCAL&nbsp;DESK&nbsp;/&nbsp;ECUST</span>
    </div>
    <nav class="modes" role="tablist">
      <button class="mode-btn is-active" data-view="search" role="tab" aria-selected="true">
        <span class="mode-num">01</span><span class="mode-name">知识库搜索</span>
      </button>
      <button class="mode-btn" data-view="apps" role="tab" aria-selected="false">
        <span class="mode-num">02</span><span class="mode-name">应用台</span>
      </button>
    </nav>
    <div class="srv" id="srv-status" title="本地服务状态">
      <span class="dot"></span><span class="srv-txt">连接中</span>
    </div>
  </header>

  <main class="stage">

    <!-- ============ 模式一：知识库搜索 ============ -->
    <section id="view-search" class="view is-active">

      <div class="search-head">
        <p class="eyebrow">LOCAL KNOWLEDGE BASE</p>
        <h1 class="search-title">问一句，翻整库。</h1>
        <form id="search-form" class="search-box" autocomplete="off">
          <input id="q" type="text" placeholder="输入问题，例如：卷积层如何求梯度？" aria-label="搜索问题">
          <button type="submit" class="go-btn">检索</button>
        </form>

        <div class="opts">
          <label class="opt">模式
            <select id="mode">
              <option value="fast">fast · 快问（BGE 混合重排）</option>
              <option value="deep">deep · 深读</option>
              <option value="turbo">turbo · 冲</option>
            </select>
          </label>
          <label class="opt">范围
            <select id="scope">
              <option value="core" selected>默认域（考插+华理）</option>
            </select>
          </label>
          <div class="opts-aux" id="history" hidden></div>
        </div>
      </div>

      <div class="search-body">
        <div id="empty" class="empty">
          <div class="empty-tile">〇</div>
          <p class="empty-hint">检索结果会以<b>代码行</b>形式呈现<br>含文件来源、阶段耗时与置信分</p>
        </div>
        <div id="skeleton" class="skeleton" hidden>
          <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
        </div>
        <div id="error" class="error" hidden></div>

        <div id="results" hidden>
          <div class="result-meta">
            <span id="meta-line">—</span>
            <span class="meta-pipe">·</span>
            <span id="meta-stages">—</span>
          </div>
          <ol id="result-list" class="result-list"></ol>
        </div>
      </div>
    </section>

    <!-- ============ 模式二：应用台 ============ -->
    <section id="view-apps" class="view">
      <div class="apps-head">
        <p class="eyebrow">APP LAUNCHER</p>
        <h1 class="search-title">一键起，不用找。</h1>
        <p class="apps-sub">点击即启动本机应用 · 白名单由 <code>apps.json</code> 管理</p>
      </div>
      <div id="apps-groups" class="apps-groups"></div>
    </section>

  </main>

  <footer class="foot">
    <span>检索核心 kb_search_v4 · BGE 混合重排</span>
    <span class="foot-sep">/</span>
    <span id="foot-time">—</span>
  </footer>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
