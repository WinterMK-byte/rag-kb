# 打 tag 即发版：v0.1.0 → GitHub Release，notes 从 CHANGELOG 对应条目抽取。
#
# 两个刻意的设计：
#   ① **不用第三方 action** —— 只用 runner 自带的 `gh`。
#      发版链条上少一个第三方依赖，少一处可能悄悄变味的地方。
#   ② **notes 派生自 VERSION + CHANGELOG，不手写**。手写就会出现两份，而两份必然不同步；
#      发版页正是别人第一眼看到的那段文字，最不该漂。
#
# 抽不到对应版本会**直接失败** —— 宁可发不出去，也不要发一份空 notes。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发版的 tag（形如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 发版（先自测，再建 Release）
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 发出去的东西，至少自己先跑一遍门禁。
      - name: 发版前自测
        run: |
          python tools/version_check.py
          python tools/privacy_check.py
          python tools/data_layer_check.py

      # ★ tag 说的版本 必须等于 VERSION 里的版本
      - name: 版本与 tag 对齐
        run: |
          echo "tag = $TAG"
          python tools/version_check.py --expect "${TAG#v}"

      - name: 从 CHANGELOG 抽本次版本的 notes
        run: |
          python tools/changelog_extract.py "${TAG#v}" --out notes.md
          echo "--- notes 预览（前 15 行）---"
          head -n 15 notes.md

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 —— 更新 notes（重跑安全）"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
